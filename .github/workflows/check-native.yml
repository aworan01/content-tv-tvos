name: Check native torrent engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Compile device and simulator libraries
        run: bash scripts/build-native.sh
      - name: Publish reusable native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          tar -czf dist/ContentTorrent-tvos-v1.tar.gz -C build/native appletvos/libContentTorrent.a appletvsimulator/libContentTorrent.a
          (cd dist; shasum -a 256 ContentTorrent-tvos-v1.tar.gz) > dist/Native-SHA256.txt
          gh release create "native-v1-${GITHUB_RUN_NUMBER}" dist/ContentTorrent-tvos-v1.tar.gz dist/Native-SHA256.txt Sources/Resources/*LICENSE* --prerelease --target "$GITHUB_SHA" --title "Native torrent dependency v1 build ${GITHUB_RUN_NUMBER}" --notes "Pinned libtorrent 2.0.11 and Boost 1.85.0, arm64 tvOS device/simulator. This is a build dependency, not an installable app. App integration tests run in the main workflow."
